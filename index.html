<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Chapín | Tienda de videojuegos</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header>
  <div class="logo">Pixel <span>Chapín</span></div>
  <button class="btn-carrito" id="abrir" aria-label="Abrir carrito">Carrito <b id="contador">0</b></button>
</header>

<section class="hero">
  <h1>Tus juegos favoritos, en quetzales.</h1>
  <p>Elegí tus juegos, agregalos al carrito y mirá el total al instante.</p>
</section>

<div class="controles" id="controles">
  <button class="chip" data-cat="Todos" aria-pressed="true">Todos</button>
  <button class="chip" data-cat="Aventura" aria-pressed="false">Aventura</button>
  <button class="chip" data-cat="Acción" aria-pressed="false">Acción</button>
  <button class="chip" data-cat="Carreras" aria-pressed="false">Carreras</button>
  <button class="chip" data-cat="Indie" aria-pressed="false">Indie</button>
  <input id="buscar" type="search" placeholder="Buscar juego..." aria-label="Buscar juego">
</div>

<main id="catalogo"></main>

<div class="fondo" id="fondo"></div>
<aside id="carrito" aria-label="Carrito de compras">
  <header><h2>Tu carrito</h2><button class="cerrar" id="cerrar" aria-label="Cerrar carrito">&times;</button></header>
  <div id="lista"></div>
  <div class="total">
    <div><span>Total</span><span id="total">Q 0.00</span></div>
    <button class="pagar" id="pagar">Finalizar compra</button>
  </div>
</aside>
<div class="aviso" id="aviso" role="status"></div>

<script src="js/app.js"></script>
</body>
</html>
